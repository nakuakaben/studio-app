[package]
name = "studio-app"
default-run = "studio-app"
version = "0.1.0"
edition = "2021"
description = "Native launcher for the Studio App professional software suite"
license = "MIT"

[features]
visual-qa = []
installer-fixtures = ["dep:rcgen", "dep:rustls"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
semver = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
ring = "0.17"
zip = { version = "4", default-features = false, features = ["deflate"] }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tempfile = "3"
directories = "6"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "studio-installer-probe"
path = "tools/installer_probe.rs"
required-features = ["installer-fixtures"]

[[bin]]
name = "studio-installer-fixture"
path = "tools/installer_fixture.rs"
required-features = ["installer-fixtures"]

[[bin]]
name = "studio-catalog"
path = "tools/studio_catalog.rs"
