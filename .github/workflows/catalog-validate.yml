name: Catalog publication gate
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  approval:
    name: Offline Ed25519 publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .catalog-base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev
      - name: Verify against trusted base registration and public keys
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/catalog_automation.py validate-pr
