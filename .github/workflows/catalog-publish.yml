name: Publish approved catalog
on:
  push:
    branches: [dev]
    paths: ['distribution/catalog.json', 'distribution/proposal.json', 'distribution/approvals.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  publish:
    if: vars.CATALOG_PUBLICATION_ENABLED == 'true' && github.ref == 'refs/heads/dev'
    environment: catalog-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bin studio-catalog
      - name: Verify signatures before atomic catalog branch publication
        env:
          CATALOG_WRITE_TOKEN: ${{ secrets.CATALOG_PUBLISH_TOKEN }}
        run: python3 tools/catalog_automation.py publish
